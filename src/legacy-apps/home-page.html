<!-- Wallpaper layers -->
<div id="wallpaper"></div>
<div id="veil"></div>

<!-- Hidden file inputs -->
<input type="file" id="wp-input"    accept="image/*"          style="display:none" onchange="onWpFile(event)" />
<input type="file" id="photo-input" accept="image/*" multiple style="display:none" onchange="onPhotoFiles(event)" />
<input type="file" id="icon-input"  accept="image/*"          style="display:none" onchange="onIconFile(event)" />
<input type="file" id="music-input" accept="audio/*" multiple style="display:none" onchange="onMusicFiles(event)" />
<audio id="home-audio" preload="metadata"></audio>
<div id="music-library-modal" onclick="closeMusicLibrary(event)">
  <div class="music-library-card" onclick="event.stopPropagation()">
    <div class="music-library-head">
      <div>
        <h3 class="music-library-title">Perle</h3>
        <p class="music-library-subtitle">只保存在这台设备的浏览器里，不会上传到 Supabase。</p>
      </div>
      <button class="music-library-close" type="button" aria-label="关闭" onclick="closeMusicLibrary()">×</button>
    </div>
    <div class="music-library-actions">
      <button class="music-library-action" type="button" onclick="pickMusicFiles()">导入本地音乐</button>
      <button class="music-library-action secondary" type="button" onclick="playCurrentOrFirstTrack()">播放当前</button>
    </div>
    <div id="music-library-list" class="music-library-list"></div>
  </div>
</div>

<!-- Edit-mode done button -->
<button id="btn-done"
  class="glass text-[12.5px] font-semibold text-rose-500 px-6 py-2 rounded-full ring-1 ring-white/60 shadow-md"
  onclick="exitEditMode()">完成</button>

        <div id="di-idle" class="flex items-center justify-center relative">
          <span style="font-size:11px;color:rgba(255,255,255,0.88);letter-spacing:0.02em;">✦</span>
          <span id="di-count-badge" style="display:none;position:absolute;top:-5px;right:-6px;min-width:14px;height:14px;border-radius:7px;background:rgba(220,100,80,0.9);color:white;font-size:9px;font-weight:700;line-height:14px;text-align:center;padding:0 3px;"></span>
        </div>
        <!-- Expanded: Glean todo overlay -->
        <div id="di-msg" class="w-full">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
            <span style="color:rgba(255,255,255,0.92);font-size:13px;font-weight:700;letter-spacing:0.06em;">✦ GLEAN 拾遗</span>
            <button id="di-open-all" style="background:none;border:none;color:rgba(255,255,255,0.55);font-size:11px;cursor:pointer;padding:0;" onclick="event.stopPropagation();window.__gleanOpenAll&&window.__gleanOpenAll()">全部 ›</button>
          </div>
          <div id="di-glean-items" style="display:flex;flex-direction:column;gap:8px;">
            <div style="color:rgba(255,255,255,0.35);font-size:11.5px;text-align:center;padding:8px 0;">加载中…</div>
          </div>
          <div id="di-glean-empty" style="display:none;color:rgba(255,255,255,0.3);font-size:11.5px;text-align:center;padding:10px 0 4px;">暂无待处理事项</div>
        </div>
      </div>
