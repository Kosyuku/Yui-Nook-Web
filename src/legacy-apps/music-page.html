<div id="page-music" class="page hidden sub-page">
  <div class="mx-auto w-full max-w-[414px] h-full flex flex-col">
    <header class="sub-header media-sub-header"><span class="glass-refraction"></span>
      <button onclick="closePage('page-music')"
        class="media-back-btn active:scale-90 transition-transform shrink-0" aria-label="返回">
        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6" /></svg>
      </button>
      <h1 class="media-title">Perle</h1>
      <button onclick="pickMusicFiles()"
        class="media-action-btn active:scale-90 transition-transform shrink-0">+ 导入</button>
    </header>
    <div class="music-page-shell">
      <div class="music-page-card">
        <div class="music-page-now">
          <div class="music-page-kicker">LOCAL MUSIC</div>
          <div id="music-page-current-title" class="music-page-title">打开 Perle</div>
          <div id="music-page-current-subtitle" class="music-page-subtitle">从本地文件导入后，就会一直保存在这个浏览器里。</div>
          <div class="music-page-controls">
            <button class="music-page-btn" type="button" aria-label="上一首" onclick="playPrevTrack()">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M6.2 8 10 5.25v5.5L6.2 8Z"></path>
                <rect x="4.2" y="5" width="1.2" height="6" rx=".6"></rect>
              </svg>
            </button>
            <button id="music-page-play-btn" class="music-page-btn play" type="button" aria-label="播放" onclick="togglePlay()">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 13.3 3.36 8.66a2.9 2.9 0 1 1 4.1-4.1L8 5.1l.54-.54a2.9 2.9 0 0 1 4.1 4.1L8 13.3Z"></path>
              </svg>
            </button>
            <button class="music-page-btn" type="button" aria-label="下一首" onclick="playNextTrack()">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="m9.8 8-3.8-2.75v5.5L9.8 8Z"></path>
                <rect x="10.6" y="5" width="1.2" height="6" rx=".6"></rect>
              </svg>
            </button>
          </div>
        </div>
        <div class="music-page-actions">
          <button class="music-page-action" type="button" onclick="pickMusicFiles()">导入本地音乐</button>
          <button class="music-page-action" type="button" onclick="playCurrentOrFirstTrack()">播放当前</button>
        </div>
        <div id="music-page-list" class="music-page-list"></div>
      </div>
      </div>
    </div>
  <div class="media-page-tabbar">
    <button class="media-page-tab" type="button" onclick="switchMediaPage('photos')">
      <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      <span>图库</span>
    </button>
    <button class="media-page-tab active" type="button" onclick="switchMediaPage('music')">
      <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 18V7.8l9-1.8v10.4"/><circle cx="7.4" cy="18" r="2.2"/><circle cx="16.4" cy="16.2" r="2.2"/></svg>
      <span>音乐</span>
    </button>
  </div>
</div><!-- /music -->
